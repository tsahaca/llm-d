apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-small
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: qwen-small
  template:
    metadata:
      labels:
        app: qwen-small
        llm-d.ai/guide: optimized-baseline
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:v0.33.0-arm64
          args:
            - Qwen/Qwen3-0.6B
            - --host=0.0.0.0
            - --port=8000
            - --dtype=float32
            - --max-model-len=512
            - --max-num-seqs=2
            - --enforce-eager
            - --kv-cache-memory-bytes=268435456
          env:
            # - name: VLLM_CPU_KVCACHE_SPACE
            #   value: "1"
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: nobind
            - name: OMP_NUM_THREADS
              value: "2"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi       