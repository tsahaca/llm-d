apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: modelserver
      spec:
        replicas: 2
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        template:
          spec:
            nodeSelector:
              cloud.google.com/gke-nodepool: l4-pool-c
              cloud.google.com/gke-gpu-sharing-strategy: time-sharing
              cloud.google.com/gke-max-shared-clients-per-gpu: "2"
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution: null
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
            containers:
              - name: modelserver
                env:
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: llm-d-hf-token
                      key: HF_TOKEN
                      optional: true
                args:
                  - Qwen/Qwen3-0.6B
                  - --host=0.0.0.0
                  - --port=8000
                  - --tensor-parallel-size=1
                  - --max-model-len=4096
                  - --gpu-memory-utilization=0.40
                  - --enable-prefix-caching
                  - --shutdown-timeout=45
                resources:
                  requests:
                    cpu: "2"
                    memory: 8Gi
                    nvidia.com/gpu: 1
                  limits:
                    cpu: "4"
                    memory: 16Gi
                    nvidia.com/gpu: 1
            volumes:
              - name: shm
                emptyDir:
                  medium: Memory
                  sizeLimit: 2Gi
